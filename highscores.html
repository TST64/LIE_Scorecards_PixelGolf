<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCH IHN EIN - Highscore Dashboard</title>
    <style>
        body
        {
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1
        {
            color: #f1c40f;
            margin-bottom: 20px;
        }

        .dashboard-container
        {
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .back-btn
        {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #2ecc71;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .back-btn:hover
        {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>🏆 Highscore Dashboard</h1>

    <div class="dashboard-container">
        <p style="text-align: center; color: #94a3b8;">Lade beste Ergebnisse...</p>
        <!-- Hier werden die Highscore-Daten dynamisch aus Google Sheets geladen -->
    </div>

    <a href="index.html" class="back-btn">⬅️ Zurück zum Spiel</a>

</body>
</html>
